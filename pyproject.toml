[tool.poetry]
name = "fiap-id-tech-challenge2"
version = "0.1.0"
description = "Tech Challenge Fase 2 – PosTech IA para Devs – Algoritmos Genéticos e LLMs"
authors = ["trcosta97"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

# Algoritmos Genéticos
numpy = "^1.26.4"

# LLM / NLP
openai = "^1.30.1"          # ou trocar por outro provider
tiktoken = "^0.7.0"

# Visualização
matplotlib = "^3.9.0"
seaborn = "^0.13.2"

# Utilitários
python-dotenv = "^1.0.1"
pydantic = "^2.7.1"
pyyaml = "^6.0.1"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.1"
pytest-cov = "^5.0.0"
ruff = "^0.4.4"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
